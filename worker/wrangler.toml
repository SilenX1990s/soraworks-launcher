name = "soraworks"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# --- D1 database ---
# Create it once with:  wrangler d1 create soraworks
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "soraworks"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# --- R2 bucket (private) for modpack files, launcher updates, media ---
# Create it with:  wrangler r2 bucket create soraworks-files
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "soraworks-files"

[vars]
# Public, non-secret config. Secrets (ADMIN_TOKEN, DISCORD_WEBHOOK, R2 keys)
# are set with `wrangler secret put <NAME>` and never committed.
APP_NAME = "SoraWorks"

# Local dev uses a persisted miniflare D1/R2; no real Cloudflare account needed.
# For production set secrets:
#   wrangler secret put ADMIN_TOKEN       # dashboard owner auth
#   wrangler secret put LICENSE_PRIVATE_KEY  # Ed25519 (later phase)
